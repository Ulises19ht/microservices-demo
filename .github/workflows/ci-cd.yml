name: CI/CD Pipeline with Helm Chart

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 
  pull_request:
    branches: [ "main", "master" ]
    types: [ closed ]

jobs:
  build-push-deploy:
    runs-on: self-hosted
    strategy:
      matrix:
        service:
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      # Inyectar credenciales desde Vault usando CLI directa
      - name: Import Secrets from Vault
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          SECRET_JSON=$(vault kv get -format=json secret/online-boutique/dockerhub)
          
          DOCKER_USER=$(echo "$SECRET_JSON" | jq -r '.data.data.username')
          DOCKER_TOK=$(echo "$SECRET_JSON" | jq -r '.data.data.token')
          
          echo "DOCKERHUB_USERNAME=$DOCKER_USER" >> $GITHUB_ENV
          echo "DOCKERHUB_TOKEN=$DOCKER_TOK" >> $GITHUB_ENV

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: CI - Compilar y publicar imagen de ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./src/${{ matrix.service }}
          push: true
          tags: |
            ulisestec/${{ matrix.service }}:latest
            ulisestec/${{ matrix.service }}:${{ github.sha }}

      - name: Preparar dependencias de Helm
        run: helm dependency build ./helm-chart

      - name: CD - Desplegar en Kubernetes usando Helm Chart
        run: helm upgrade --install online-boutique ./helm-chart --force
